name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        id: co
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        id: gset
        with:
          gradle-version: "8.5"
      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Report
        if: failure()
        run: |
          echo "::warning::steps: checkout=${{ steps.co.outcome }} java=${{ steps.java.outcome }} gradle-setup=${{ steps.gset.outcome }} build=${{ steps.build.outcome }}"
          if [ -f build.log ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|AAPT|Unresolved|not found" -A3 build.log | head -25 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::warning::${msg}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
